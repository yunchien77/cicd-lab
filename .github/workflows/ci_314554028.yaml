name: CI Pipeline

on:
  push:
    branches:
      - '**' # trigger on all branches
  pull_request: # trigger on pull requests

permissions:
  contents: read
  checks: write # show test result on GitHub Actions checks

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        id: typecheck
        run: |
          npm run typecheck 2>&1 | tee typecheck-output.txt
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: TypeScript typecheck summary
        if: always() && steps.typecheck.outcome == 'failure'
        run: |
          echo "### ❌ TypeScript Typecheck Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat typecheck-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Prettier check
        id: prettier
        if: always()
        run: |
          npm run format:check 2>&1 | tee prettier-output.txt
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Prettier check summary
        if: always() && steps.prettier.outcome == 'failure'
        run: |
          echo "### ❌ Prettier Check Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat prettier-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Run tests
        id: tests
        if: always()
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/vitest-junit.xml
          fail_on_failure: true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
          if-no-files-found: error
